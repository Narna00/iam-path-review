[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-path-review"
version = "0.1.0"
description = "Find separation-of-duties conflicts caused by direct or inherited access in normalized identity exports."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
iam-path-review = "iam_paths:main"

[tool.setuptools]
py-modules = ["iam_paths"]
